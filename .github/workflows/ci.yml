name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Solo para generate/build: la Fase 0 no se conecta a ninguna base en CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec prisma migrate deploy
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_test
      - run: pnpm test:coverage # exige 100 % en domain/ y shop/; integración de SM contra Postgres
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      - run: pnpm build

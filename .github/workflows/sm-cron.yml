name: SM cron

# Vercel Hobby solo permite crons diarios (el sync completo está en vercel.json).
# Los frecuentes (stock cada hora; incremental y seguimiento de pedidos cada 2 h) los dispara
# este workflow contra las mismas rutas, con el mismo CRON_SECRET.
# Secrets del repo: CRON_BASE_URL (ej. https://tesera.com.ar) y CRON_SECRET.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE: ${{ secrets.CRON_BASE_URL }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Sin configurar → no hace nada
        if: env.BASE == '' || env.SECRET == ''
        run: echo "Faltan CRON_BASE_URL / CRON_SECRET" && exit 0
      - name: Stock
        if: env.BASE != '' && env.SECRET != ''
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $SECRET" "$BASE/api/cron/sm-sync-stock"
      - name: Productos (incremental) y seguimiento, horas pares
        if: env.BASE != '' && env.SECRET != ''
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ $(( $(date -u +%-H) % 2 )) -ne 0 ]; then exit 0; fi
          curl -fsS --max-time 300 -H "Authorization: Bearer $SECRET" "$BASE/api/cron/sm-sync-incremental"
          curl -fsS --max-time 300 -H "Authorization: Bearer $SECRET" "$BASE/api/cron/sm-poll-orders"
